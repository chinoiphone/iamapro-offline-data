name: Paquetes sin conexión (EE. UU.)

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Estados con el nombre de Geofabrik, separados por coma (florida,new-york,texas)"
        required: true
        default: florida

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.list.outputs.states }}
    steps:
      - id: list
        env:
          STATES: ${{ inputs.states }}
        run: |
          python3 -c "import json, os; s = [x.strip().lower() for x in os.environ['STATES'].split(',') if x.strip()]; print('states=' + json.dumps(s))" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        state: ${{ fromJson(needs.plan.outputs.states) }}
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espacio
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          docker pull ghcr.io/valhalla/valhalla:3.8.3
      - name: Preparar ${{ matrix.state }}
        run: bash scripts/build_state.sh "${{ matrix.state }}"
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_state.sh "${{ matrix.state }}"

  catalog:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    # De una en una: dos preparaciones a la vez se pisaban el catálogo.
    concurrency:
      group: iamapro-catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Catálogo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "IAmapro"
          git config user.email "iamapro@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/update_catalog.py
            git add catalog.json
            git diff --cached --quiet && { echo "Sin cambios en el catálogo"; break; }
            git commit -q -m "Catálogo de paquetes"
            git push -q origin HEAD:main && break
            sleep 10
          done

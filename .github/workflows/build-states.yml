name: Paquetes sin conexión (EE. UU.)

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Estados con el nombre de Geofabrik, separados por coma (florida,new-york,california/norcal), o «all» para todos"
        required: true
        default: florida
      foursquare:
        description: "Sumar los lugares de Foursquare (necesita el secreto FSQ_HF_TOKEN)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.list.outputs.states }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          STATES: ${{ inputs.states }}
        run: |
          python3 -c "import json, os; raw = os.environ['STATES'].strip().lower(); s = [x.strip() for x in open('scripts/us-states.txt')] if raw == 'all' else [x.strip() for x in raw.split(',') if x.strip()]; print('states=' + json.dumps([x for x in s if x]))" >> "$GITHUB_OUTPUT"

  # Una sola vez: los lugares de Foursquare de EE. UU. (Hugging Face no filtra
  # por zona; ver scripts/foursquare.py). Cada estado usa este resultado.
  foursquare:
    needs: plan
    if: ${{ inputs.foursquare }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Sacar EE. UU. de Foursquare
        env:
          FSQ_HF_TOKEN: ${{ secrets.FSQ_HF_TOKEN }}
        run: |
          python3 -m pip install -q duckdb
          python3 scripts/foursquare.py extract fsq-us.parquet
          ls -la fsq-us.parquet fsq-us.parquet.release
      - uses: actions/upload-artifact@v4
        with:
          name: foursquare-us
          path: |
            fsq-us.parquet
            fsq-us.parquet.release
          retention-days: 3
          compression-level: 0

  build:
    needs: [plan, foursquare]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.foursquare.result == 'success' || needs.foursquare.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        state: ${{ fromJson(needs.plan.outputs.states) }}
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espacio
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Lugares de Foursquare
        if: ${{ needs.foursquare.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: foursquare-us
          path: ${{ github.workspace }}/fsq
      - name: Herramientas
        run: |
          if [ -f "$GITHUB_WORKSPACE/fsq/fsq-us.parquet" ]; then
            echo "FSQ_US_PARQUET=$GITHUB_WORKSPACE/fsq/fsq-us.parquet" >> "$GITHUB_ENV"
            echo "Foursquare $(cat "$GITHUB_WORKSPACE/fsq/fsq-us.parquet.release")"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python3 -m pip install -q duckdb
          docker pull ghcr.io/valhalla/valhalla:3.8.3
          # La última versión de Overture Maps (lugares).
          RELEASE=$(curl -s "https://overturemaps-us-west-2.s3.us-west-2.amazonaws.com/?list-type=2&prefix=release/&delimiter=/" \
            | grep -oE "release/[0-9-]+\.[0-9]+/" | sed 's#release/##; s#/##' | sort | tail -1)
          echo "Overture: $RELEASE"
          echo "OVERTURE_RELEASE=$RELEASE" >> "$GITHUB_ENV"
      - name: Preparar ${{ matrix.state }}
        run: bash scripts/build_state.sh "${{ matrix.state }}"
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_state.sh "${{ matrix.state }}"

  catalog:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    # De una en una: dos preparaciones a la vez se pisaban el catálogo.
    concurrency:
      group: iamapro-catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Catálogo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "IAmapro"
          git config user.email "iamapro@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/update_catalog.py
            git add catalog.json
            git diff --cached --quiet && { echo "Sin cambios en el catálogo"; break; }
            git commit -q -m "Catálogo de paquetes"
            git push -q origin HEAD:main && break
            sleep 10
          done
